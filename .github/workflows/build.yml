name: build

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java (Android builds)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Flutter pub get
        run: flutter pub get

      - name: Run all unit tests
        run: flutter test

      - name: Bump build number and push pubspec.yaml to master
        run: |
          VERSION_LINE=$(grep -E '^version: ' pubspec.yaml)
          VERSION=$(echo "$VERSION_LINE" | awk '{print $2}')
          NAME=$(echo "$VERSION" | cut -d+ -f1)
          NUMBER=$(echo "$VERSION" | cut -d+ -f2)
          NEW_NUMBER=$((NUMBER + 1))
          NEW_VERSION="${NAME}+${NEW_NUMBER}"
          sed -i -E "s/^version: .*/version: ${NEW_VERSION}/" pubspec.yaml
          echo "Bumped version $VERSION -> $NEW_VERSION"
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git diff --cached --quiet || git commit -m "chore: bump build number to $NEW_VERSION [skip ci]"
          git push origin HEAD:master

      - name: Install flutter_distributor
        run: |
          dart pub global activate flutter_distributor
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Build stable-linux-deb
        run: flutter_distributor release --name=stable --jobs=stable-linux-deb

      - name: Build stable-android-apk
        run: flutter_distributor release --name=stable --jobs=stable-android-apk

      - name: List dist artifacts
        run: ls -R dist/

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
